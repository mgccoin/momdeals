# Fly.io configuration — MomDeals website (Next.js)
# Calls the momdeals-api Fly app for products + posts data.

app = "momdeals"
primary_region = "lax"

[build]

[env]
  PORT     = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
